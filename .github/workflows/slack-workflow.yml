name: Merge to Slack Workflow

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print Greeting
        run: echo "Start to try the merge!"

  auto-merge:
    runs-on: ubuntu-latest
    needs: first-job
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_ACTIONS }}
      SOURCE_BRANCH: "develop"
      TARGET_BRANCH: "feature/uploads"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Bot CI/CD"
          git config user.email "botcicd@yecid.com"

      - name: Fetch and Merge
        id: merge_step
        run: |
          git fetch origin
          git checkout $TARGET_BRANCH
          git pull origin $TARGET_BRANCH

          if git merge origin/$SOURCE_BRANCH --no-commit --no-ff; then
            git commit -m "Auto-merge $SOURCE_BRANCH into $TARGET_BRANCH"
            git push origin $TARGET_BRANCH
            DIFF_SUMMARY=$(git diff --stat origin/$SOURCE_BRANCH..$TARGET_BRANCH | tr '\n' ' ')
            echo "DIFF_SUMMARY=$DIFF_SUMMARY" >> "$GITHUB_ENV"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            git merge --abort
            echo "status=conflict" >> $GITHUB_OUTPUT
          fi
          
      - name: Merge success message to Slack Workflow
        if: steps.merge_step.outputs.status == 'success'
        run: |
          curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"✅ *[MERGE DONE]* Branch merge completed successfully!\n*Source Branch:* \`$SOURCE_BRANCH\`\n*Target Branch:* \`$TARGET_BRANCH\`\n*Comparison Summary:* \`\`\`$DIFF_SUMMARY\`\`\`\"}" \
              $SLACK_WEBHOOK_URL

      - name: Send Conflict message to Slack Workflow
        if: steps.merge_step.outputs.status == 'conflict'
        run: |
          curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"🚨 *[MERGE CONFLICT ALERT]* Manual merge required.\n*Source Branch:* \`$SOURCE_BRANCH\`\n*Target Branch:* \`$TARGET_BRANCH\`\n*Conflicting Files:*\n\`\`\`XX\`\`\`\"}" \
              $SLACK_WEBHOOK_URL
 