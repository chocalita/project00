name: Slack Workflow

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Print Greeting
        run: echo "Start to try the merge!"

  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Bot CI/CD"
          git config user.email "botcicd@yecid.com"

      - name: Fetch and Merge
        id: merge_step
        run: |
          git fetch origin
          git checkout feature/uploads
          git pull origin feature/uploads

          if git merge origin/develop --no-commit --no-ff; then
            git commit -m "Auto-merge develop into feature/uploads"
            git push origin feature/uploads
            echo "status=success" >> $GITHUB_OUTPUT
          else
            git merge --abort
            echo "status=conflict" >> $GITHUB_OUTPUT
          fi
          
      - name: Merge successt message to Slack Workflow
        if: steps.merge_step.outputs.status == 'success'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SOURCE_BRANCH: "develop"
          TARGET_BRANCH: "feature/uploads"
        run: |
          curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"✅ *[MERGE DONE]* Branch merge completed successfully!\n*Source:* \`$SOURCE_BRANCH\`\n*Target:* \`$TARGET_BRANCH\`\n*Comparison summary:* \`\`\`$DIFF_SUMMARY\`\`\`\"}" \
              $SLACK_WEBHOOK_URL

       - name: Send Conflict message to Slack Workflow
        if: steps.merge_step.outputs.status == 'conflict'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SOURCE_BRANCH: "develop"
          TARGET_BRANCH: "feature/uploads"
        run: |
          curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"🚨 *[MERGE CONFLICT ALERT]* Manual merge required.\n*Source:* \`develop\`\n*Target:* \`feature/uploads\`\n*Archivos con conflicto:*\n\`\`\`XX\`\`\`\"}" \
              $SLACK_WEBHOOK_URL
 